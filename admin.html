<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-4">
<div class="max-w-4xl mx-auto">
<div class="flex justify-between mb-4"><h1 class="text-2xl font-bold">Inventory Panel</h1><a href="index.html" class="bg-indigo-600 text-white px-3 py-2 rounded">View Store</a></div>
<div class="bg-white p-4 rounded shadow mb-4">
<div class="grid grid-cols-2 gap-2">
<input id="pname" placeholder="Name" class="border p-2 rounded">
<input id="pprice" placeholder="Price" type="number" class="border p-2 rounded">
<input id="pstock" placeholder="Stock" type="number" class="border p-2 rounded">
<input id="pimage" placeholder="Image URL" class="border p-2 rounded">
</div>
<button onclick="saveProduct()" class="bg-green-600 text-white px-4 py-2 rounded mt-3">Save</button>
</div>
<table class="w-full bg-white rounded shadow"><thead class="bg-black text-white"><tr><th class="p-2 text-left">Name</th><th class="p-2">Price</th><th class="p-2">Stock</th><th class="p-2">Action</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<script>
const defaultProducts=[
{id:1,name:"Headphones",price:1999,image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",stock:50},
{id:2,name:"Smart Watch",price:2999,image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400",stock:30},
{id:3,name:"Shoes",price:3499,image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",stock:25},
{id:4,name:"Backpack",price:1299,image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400",stock:40},
{id:5,name:"Sunglasses",price:999,image:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400",stock:60},
{id:6,name:"Speaker",price:2499,image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e?w=400",stock:20},
{id:7,name:"Laptop Stand",price:899,image:"https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=400",stock:35},
{id:8,name:"Coffee Mug",price:499,image:"https://images.unsplash.com/photo-1514228742587-6b1558fcf93a?w=400",stock:100},
];
let products=JSON.parse(localStorage.getItem('products'))||defaultProducts;
let editId=null;
function render(){document.getElementById('tbody').innerHTML=products.map(p=>`<tr class="border-t"><td class="p-2">${p.name}</td><td class="p-2">Rs ${p.price}</td><td class="p-2">${p.stock}</td><td class="p-2"><button onclick="editP(${p.id})" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">Edit</button><button onclick="delP(${p.id})" class="bg-red-600 text-white px-2 py-1 rounded text-xs ml-1">Del</button></td></tr>`).join(''); localStorage.setItem('products',JSON.stringify(products));}
function saveProduct(){const n=document.getElementById('pname').value, pr=parseInt(document.getElementById('pprice').value), st=parseInt(document.getElementById('pstock').value), im=document.getElementById('pimage').value; if(!n||!pr) return alert('Fill name & price'); if(editId){let p=products.find(x=>x.id===editId); p.name=n; p.price=pr; p.stock=st||p.stock; p.image=im||p.image; editId=null;} else {products.push({id:Date.now(),name:n,price:pr,stock:st||0,image:im||'https://via.placeholder.com/400'});} document.getElementById('pname').value='';document.getElementById('pprice').value='';document.getElementById('pstock').value='';document.getElementById('pimage').value=''; render();}
function editP(id){let p=products.find(x=>x.id===id); document.getElementById('pname').value=p.name; document.getElementById('pprice').value=p.price; document.getElementById('pstock').value=p.stock; document.getElementById('pimage').value=p.image; editId=id;}
function delP(id){if(confirm('Delete?')){products=products.filter(x=>x.id!==id); render();}}
render();
</script>
</body>
</html>
