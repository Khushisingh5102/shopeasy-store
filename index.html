<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<nav class="bg-white shadow p-4 flex justify-between sticky top-0">
<h1 class="text-2xl font-bold text-indigo-600">ShopEasy</h1>
<div class="flex gap-2">
<a href="admin.html" class="bg-black text-white px-3 py-2 rounded text-sm">Admin</a>
<button onclick="toggleCart()" class="bg-indigo-600 text-white px-3 py-2 rounded text-sm">Cart (<span id="cart-count">0</span>)</button>
</div>
</nav>
<section class="bg-indigo-600 text-white py-16 text-center">
<h2 class="text-4xl font-bold">Best Deals, Best Quality</h2>
<p class="mt-2">Shop from 1000+ products</p>
</section>
<div id="products" class="max-w-7xl mx-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"></div>
<div id="cart-sidebar" class="fixed right-0 top-0 h-full w-80 bg-white shadow-2xl translate-x-full transition z-50 p-4">
<div class="flex justify-between"><h3 class="font-bold text-xl">Cart</h3><button onclick="toggleCart()">X</button></div>
<div id="cart-items" class="mt-4"></div>
<p class="font-bold mt-4">Total: Rs <span id="cart-total">0</span></p>
<button onclick="checkout()" class="w-full bg-indigo-600 text-white py-2 rounded mt-2">Checkout</button>
</div>
<script>
const defaultProducts=[
{id:1,name:"Headphones",price:1999,image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",stock:50},
{id:2,name:"Smart Watch",price:2999,image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400",stock:30},
{id:3,name:"Shoes",price:3499,image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",stock:25},
{id:4,name:"Backpack",price:1299,image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400",stock:40},
{id:5,name:"Sunglasses",price:999,image:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400",stock:60},
{id:6,name:"Speaker",price:2499,image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e?w=400",stock:20},
{id:7,name:"Laptop Stand",price:899,image:"https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=400",stock:35},
{id:8,name:"Coffee Mug",price:499,image:"https://images.unsplash.com/photo-1514228742587-6b1558fcf93a?w=400",stock:100},
];
let products=JSON.parse(localStorage.getItem('products'))||defaultProducts;
let cart=JSON.parse(localStorage.getItem('cart'))||[];
function renderProducts(){document.getElementById('products').innerHTML=products.map(p=>`<div class="bg-white rounded shadow p-3"><img src="${p.image}" class="h-32 w-full object-cover rounded"><h3 class="font-bold mt-2">${p.name}</h3><p class="text-sm">Stock:${p.stock}</p><p class="text-indigo-600 font-bold">Rs ${p.price}</p><button onclick="addToCart(${p.id})" class="w-full bg-indigo-600 text-white py-1 rounded mt-1">Add</button></div>`).join('');}
function addToCart(id){let i=cart.find(c=>c.id===id); if(i) i.qty++; else {let p=products.find(x=>x.id===id); cart.push({...p,qty:1});} localStorage.setItem('cart',JSON.stringify(cart)); updateCart();}
function updateCart(){document.getElementById('cart-count').textContent=cart.reduce((a,b)=>a+b.qty,0); document.getElementById('cart-items').innerHTML=cart.map(c=>`<div class="flex justify-between text-sm py-1"><span>${c.name} x${c.qty}</span><span>Rs ${c.price*c.qty}</span></div>`).join(''); document.getElementById('cart-total').textContent=cart.reduce((a,b)=>a+b.price*b.qty,0);}
function toggleCart(){document.getElementById('cart-sidebar').classList.toggle('translate-x-full');}
function checkout(){alert('Order Placed! Total Rs '+document.getElementById('cart-total').textContent); cart=[]; localStorage.setItem('cart',JSON.stringify(cart)); updateCart(); toggleCart();}
renderProducts(); updateCart();
</script>
</body>
</html>
